        '400':
          description: Bad request
        '401':
          description: AccessTokenKey and AccessTokenSecret are wrong or invalid
        '403':
          description: You do not have permission to perform the requested operation | You have reached the maximum number of calls for this api | The client id {clientId} is inactive
        '404':
          description: The client {clientId} doesn't exist
  /client/{clientId}/mediamanager/{mediaId}:
    get:
      tags:
      - Content Listings
      summary: Media Manager Derivative Content Text
      description: 'Retrieves the metadata for a particular derivative content in Media Manager, identified by *mediaId*.


        **Derivative content supported:**


        - Autogenerated Ebook

        - Autogenerated Blog Post

        - Autogenerated Key Takeaways

        - Transcript'
      operationId: ContentListings.MediaManagerDerivativeContentText
      parameters:
      - name: clientId
        in: path
        description: The client id
        required: true
        schema:
          type: string
        example: 15448
      - name: accessTokenKey
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: mediaId
        in: path
        description: The media id of the content requested
        required: true
        schema:
          type: string
        example: 2775881
      responses:
        '200':
          description: Returns content metadata
          content:
            application/json:
              example:
                contenttype: Transcript
                title: This is a title
                mediaid: 5775881
                sourceeventid: 2478889
                sourceeventtitle: Some Webinar Name
                createddate: '2023-02-02T03:20:00-08:00'
                createdby: Joe Smith
                thumbnail: http://gateway.on24.com/event/57/75/88/1/rt/1/images/thumbnail/sample.png
                urls:
                - parentid: 1245667
                  url: https://gateway.on24.com/wcc/nurture/2775881/25D40D5588A0B7BF420C5976C78DE19B/some-webinar-name
                - parentid: 9876441
                  url: https://gateway.on24.com/wcc/nurture/9775881/95D40D5588A0B7BF420C5976C78DE19B/some-webinar-name
                tags:
                - name: Tag 1
                - name: Tag 2
                - name: Tag 3
                funnelstages:
                - name: Awareness
                - name: Consideration
                - name: Evaluation
                - name: Retention
                text: <p><h1>Lorem ipsum dolor sit amet,</h1> consectetur adipisci elit, sed eiusmod tempor incidunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur. Quis aute iure reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint obcaecat cupiditat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p>
        '400':
          description: Bad request
        '401':
          description: AccessTokenKey and AccessTokenSecret are wrong or invalid
        '403':
          description: You do not have permission to perform the requested operation | You have reached the maximum number of calls for this api | The client id {clientId} is inactive
        '404':
          description: The client {clientId} doesn't exist | The content identified by {mediaId} doesn't exist
components:
  securitySchemes:
    AccessTokenKey:
      type: apiKey
      description: API access token key issued by the ON24 platform. Must be supplied together with AccessTokenSecret.
      name: AccessTokenKey
      in: header
    AccessTokenSecret:
      type: apiKey
      description: API access token secret corresponding to the AccessTokenKey. Must be supplied together with AccessTokenKey.
      name: AccessTokenSecret
      in: header
