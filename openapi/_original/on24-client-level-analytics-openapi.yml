  /client/{clientId}/engagedaccount:
    get:
      tags:
      - Client Level Analytics
      summary: Engaged Accounts
      description: 'Returns a list of the top engaged accounts as displayed in the Account Engagement Cloud with a link to their Account Engagement Profile. Up to 100 accounts will be listed.


        - If there are no engaged accounts, an empty list will be returned.

        - Only the last 90 days of data is used to generate the list.'
      operationId: AnalyticsClientLevel.EngagedAccounts
      parameters:
      - name: clientId
        in: path
        description: The client id
        required: true
        schema:
          type: string
        example: 15448
      - name: accessTokenKey
        in: header
        description: client access token key
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: client access token secret
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      responses:
        '200':
          description: Return list of engaged accounts
          content:
            application/json:
              example:
                accounts:
                - name: Microsoft
                  domains:
                  - microsoft.com
                  profileurl: URL_TO_MICROSOFT_ACCOUNT
                - name: Ibm
                  domains:
                  - ibm.com
                  profileurl: URL_TO_IBM_ACCOUNT
        '401':
          description: AccessTokenKey and AccessTokenSecret are wrong or invalid.
        '403':
          description: You do not have permission to perform the requested operation. | You have reached the maximum number of calls for this api. | The client id {clientId} is inactive.
        '404':
          description: The client {clientId} doesn't exist.
  /client/{clientId}/event:
    get:
      tags:
      - Client Level Analytics
      summary: Events
      description: "Returns a listing of events for a particular client. Events belonging to sub-client accounts are not included in the response.\n\n- If **startDate** and **endDate** are not sent, the response will return all events from the past 3 months.\n- The **startDate** and **endDate** will filter the list of events based on **dateFilterMode** parameter value.\n- If **includesubaccounts** is \"Y\", pagination will be required. Both **pageOffset** and **itemsPerPage** parameters will be available. Response schema differs.\n- **subaccounts** parameter conditions:\n  - Value can be 1 or more child client IDs (multiple values will need to be delimited by a comma).\n  - Child client IDs must be under the {clientId} of the request.\n  - If **subaccounts** is provided and **includeSubaccounts=N** (either explicitly or by default), the following error message is returned: *\"You have to set includesubaccounts='Y' in order to filter by subaccounts.\".*\n  - If **subaccounts** includes multiple values and at least one value is not valid, an error message is returned.\n  - When **subaccounts** is provided, the response will only return data for the child client IDs included in the parameter.\n- **dateFilterMode** accepted values (not case-sensitive):\n  - \"goodafter\" (default): date and time an event is first available for the audience.\n  - \"updated\": filters based on \"lastupdated\" attribute in the response. It may be between 2 and 12 hours to see changes on \"lastupdated\". The \"lastupdated\" is the last time an event had audience activity as:\n    - Event is created\n    - New Registrant\n    - New Attendee\n    - Poll is answered\n    - Survey is answered\n  - \"modified\": filters based on \"lastmodified\" attribute in the response. \"lastmodified\" is the last time the event's information was modified.\n  - \"creation\": date and time an event was created.\n  - \"livestart\": date and time an event starts the live broadcasting.\n  - \"liveend\": date and time an event ends the live broadcasting.\n  - \"archivestart\": date and time an event will be available on-demand for the audience.\n  - \"archiveend\": date and time an event won't be available anymore for the audience.\n- **filterOrder** accepted values (not case-sensitive):\n  - \"asc\" (default): ascending\n  - \"desc\": descending\n- **contentType** accepted values (not case-sensitive):\n  - \"all\" (default)\n  - \"experience\": Experience Hub contents\n  - \"gateway\": Engagement Hub contents\n  - \"golive\": Go Live events\n  - \"pdf\": Documents from Media Manager library\n  - \"video\": Videos from Media Manager library\n  - \"webcast\": Elite webinars\n  - \"webpage\": Links from Media Library\n  - \"forum\": Forum events\n- In the Client Level Events response, \"eventlocation\" is the same as the \"campaigncode\" (Campaign Code)."
      operationId: AnalyticsClientLevel.Events
      parameters:
      - name: accessTokenKey
        in: header
        description: client access token key
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: client access token secret
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: dateInterval
        in: query
        description: Number of days returned in a response. See Rolling Interval.
        schema:
          type: integer
          format: int64
        example: 30
      - name: dateIntervalOffset
        in: query
        description: Number of days from which the interval should encompass. See Rolling Interval.
        schema:
          type: integer
          format: int64
          default: 0
        example: 4
      - name: dateIntervalTimezone
        in: query
        description: Timezone to be used for determining the 24 hour period that constitutes a day. See Rolling Interval.
        schema:
          type: string
          default: America/Los_Angeles
        example: America/Los_Angeles
      - name: clientId
        in: path
        description: The client id
        required: true
        schema:
          type: string
        example: 15448
      - name: pageoffset
        in: query
        description: Number of page to retrieve
        schema:
          type: integer
          format: int64
          default: 0
        example: 1
      - name: startdate
        in: query
        description: startDate's max range between start and end dates can be up to 6 months
        schema:
          type: string
          default: 90 days before current date
        example: '2007-12-03'
      - name: enddate
        in: query
        description: endDate's max range between start and end dates can be up to 6 months
        schema:
          type: string
          default: current date
        example: '2007-12-05'
      - name: includesubaccounts
        in: query
        description: If 'Y' then sub-accounts will be included in the response
        schema:
          type: string
          default: N
        example: Y
      - name: datefiltermode
        in: query
        description: Type of date to be used with the startDate and endDate parameters.
        schema:
          type: string
          default: goodafter
        example: creation
      - name: filterorder
        in: query
        description: The filter order
        schema:
          type: string
          default: asc
        example: desc
      - name: includeinactive
        in: query
        description: If 'Y' then inactive events will be included in the response
        schema:
          type: string
          default: N
        example: Y
      - name: contenttype
        in: query
        description: Filter events by contentType
        schema:
          type: string
          default: all
        example: webcast
      - name: itemsperpage
        in: query
        description: Number of items to be retrieved per page
        schema:
          type: integer
          format: int64
          default: 100
        example: 25
      - name: subaccounts
        in: query
        description: Comma separated list of child client ids
        schema:
          type: string
        example: 22921, 32295
      responses:
        '200':
          description: Return list of events.
          content:
            application/json:
              examples:
                includesubaccounts is not passed or if includesubaccounts = N:
                  description: includesubaccounts is not passed or if includesubaccounts = N
                  value:
                    totalevents: 9
                    events:
                    - eventanalytics:
                        totalregistrants: 1
