    get:
      tags:
      - Client Level Analytics
      summary: Registrants
      description: "Returns a listing of registrants for a particular client. There is a limit of 100 registrants per page.\n\n- If double opt-in verification was enabled at the time of registration for an event, and a user has not completed the verification process, the user will not be included in any endpoint responses.\n- **subaccounts** parameter conditions:\n  - Value can be 1 or more child client IDs (multiple values will need to be delimited by a comma)\n  - Child client IDs must be under the {clientId} of the request\n  - If **subaccounts** is provided and **excludeSubaccounts=Y**, following error message is returned: *\"You have to set excludesubaccounts='N' in order to filter by subaccounts.\".*\n  - If **subaccounts** includes multiple values, and at least one value is not valid, an error message is returned.\n  - When **subaccounts** is provided, the response will only return the data of the child client IDs included in the parameter.\n- **dateFilterMode** parameter options (not case-sensitive):\n  - If the parameter is not included or no value is supplied, **startDate** and **endDate** will work in the manner they usually do.\n  - \"lastActivity\" is the only supported value. When passed, the response will include only those registrants who have had activity between (and including) the provided startDate and endDate. Registrant lastActivity value is updated with new modified date whenever one of the following API endpoints gets invoked to modify the registration information:\n    - REST Registration\n    - Update Registrant (client-level)\n    - Forget Registrant (client-level)\n    - Forget All Registrant (client-level)\n    - Forget All Registrant (event-level)"
      operationId: AnalyticsClientLevel.Registrants
      parameters:
      - name: clientId
        in: path
        description: The client id
        required: true
        schema:
          type: string
        example: 15448
      - name: accessTokenKey
        in: header
        description: client access token key
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: client access token secret
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: dateInterval
        in: query
        description: Number of days returned in a response. See Rolling Interval.
        schema:
          type: integer
          format: int64
        example: 30
      - name: dateIntervalOffset
        in: query
        description: Number of days from which the interval should encompass. See Rolling Interval.
        schema:
          type: integer
          format: int64
          default: 0
        example: 4
      - name: dateIntervalTimezone
        in: query
        description: Timezone to be used for determining the 24 hour period that constitutes a day. See Rolling Interval.
        schema:
          type: string
          default: America/Los_Angeles
        example: America/Los_Angeles
      - name: excludeSubaccounts
        in: query
        description: if set to "y", sub-accounts will be excluded
        schema:
          type: string
          default: N
        example: Y
      - name: pageoffset
        in: query
        description: Selects the page to retrieve
        schema:
          type: integer
          format: int64
          default: 0
        example: 1
      - name: startdate
        in: query
        description: Limit results to registrants with registration date after startDate
        schema:
          type: string
          format: date
          default: 30 days before current date
        example: '2007-12-03'
      - name: enddate
        in: query
        description: Limit results to registrants with registration date before endDate
        schema:
          type: string
          format: date
          default: current date
        example: '2007-12-05'
      - name: partnerref
        in: query
        description: filter by partnerref
        schema:
          type: string
        example: EM
      - name: userstatus
        in: query
        description: 'Filter to users based on their status. If not provided, only regular users will be returned. Possible values: any: will return all registrants, including: active, soft-deleted and forgotten registrants. deleted: will return soft-deleted users only. forgotten: will return forgotten users only. all: **deprecated** - will include regular and soft-deleted users. **Note:** By design, there is No option to exclude soft-deleted users from the response.'
