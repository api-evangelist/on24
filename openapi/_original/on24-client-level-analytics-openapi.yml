  /client/{clientId}/attendee/{email}/allevents:
    get:
      tags:
      - Client Level Analytics
      summary: Attendees by Email Multiple Events
      description: "Returns a listing of all attendance information for a specific email address. There is a limit of 100 registrants per page.\n\n- **subaccounts** parameter conditions:\n  - Value can be 1 or more child client IDs (multiple values will need to be delimited by a comma).\n  - Child client IDs must be under the {clientId} of the request.\n  - If **subaccounts** is provided and **excludeSubaccounts** is \"Y\", the following error message is returned: *\"You have to set excludesubaccounts='N' in order to filter by subaccounts.\"*\n  - If **subaccounts** includes multiple values and at least one value is not valid, an error message is returned.\n  - When **subaccounts** is provided, the response will only return data for the child client ids included in the parameter"
      operationId: AnalyticsClientLevel.AttendeesByEmailMultipleEvents
      parameters:
      - name: accessTokenKey
        in: header
        description: client access token key
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: client access token secret
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: clientId
        in: path
        description: The client id
        required: true
        schema:
          type: string
        example: 15448
      - name: email
        in: path
        description: The email to lookup
        required: true
        schema:
          type: string
        example: john.doe@on24.com
      - name: pageoffset
        in: query
        description: Selects the page to retrieve
        schema:
          type: integer
          format: int64
          default: 0
        example: 1
      - name: excludesubaccounts
        in: query
        description: if set to "Y", sub-accounts will be excluded
        schema:
          type: string
          default: N
        example: Y
      - name: subaccounts
        in: query
        description: Comma separated list of child client ids
        schema:
          type: string
        example: 22921, 32295
      - name: itemsperpage
        in: query
        description: Number of items to be retrieved per page
        schema:
          type: integer
          format: int64
          default: 100
        example: 25
      responses:
        '200':
          description: "Return list of attendees\n\n- Values for fields **liveminutes**, **archiveminutes**, **cumulativeliveminutes** and **cumulativearchiveminutes** are rounded to the closest integer value (e.g. 2.316 is returned as 2, 3.542 is returned as 4). If an attendee's actual viewing minutes are greater than 0 and less than 1, response will return 1 as the value (e.g. 0.123 is returned as 1).\n- The following values are cached on the server between 3 - 24 hours:\n  - firstliveactivity\n  - lastliveactivity\n  - liveviewed\n  - archiveviewed\n  - firstarchiveactivity\n  - lastarchiveactivity\n  - answeredpolls\n  - engagementscore"
