  /client/{clientId}/userquestions:
    get:
      tags:
      - Client Level Analytics
      summary: Client User Questions
      description: 'Returns a listing of user questions for a particular client.


        - Real-time API endpoint that returns the info for the last 5 minutes

        - The maximum duration for the **startDate** and **endDate** interval is 1 hour.'
      operationId: AnalyticsClientLevel.UserQuestions
      parameters:
      - name: accessTokenKey
        in: header
        description: client access token key
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: client access token secret
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: excludesubaccounts
        in: query
        description: if set to "Y", sub-accounts will be excluded
        schema:
          type: string
          default: N
        example: Y
      - name: emailFilter
        in: query
        description: Limit the questions returned to only those from specific domains
        schema:
          type: string
        example: microsoft.com|intel.com|ba.com
      - name: clientId
        in: path
        description: The client id
        required: true
        schema:
          type: string
        example: 15448
      - name: startdate
        in: query
        description: Limit the results to those occurring after this date/time
        schema:
          type: string
          default: 5 minutes ago
        example: '2012-05-19T12:00:00-05:00'
      - name: enddate
        in: query
        description: limit the results to those occurring before this date/time
        schema:
          type: string
          default: now
        example: '2012-05-19T12:00:00-05:00'
      responses:
        '200':
          description: Return list of user questions
          content:
            application/json:
              example:
                questions:
                - eventid: 10115107
                  clientid: 22921
                  eventuserid: 150146421
                  questionid: 6268257
                  createtimestamp: '2017-06-15T01:06:54-07:00'
                  content: Hello , This is Question With Answer send to ALL
                  firstname: Kunal
                  lastname: XXXXXX
                  email: xxxxxxxxxx@on24.com
                  answer:
                    createtimestamp: '2017-06-15T01:07:43-07:00'
                    content: Sent to ALL
                    presenterid: 1992131
                    presentername: Kunal Presenter ONE
                    privacy: Private
                  exteventusercd: '986'
        '400':
          description: the startDate and endDate are more than 1 hour apart.
        '401':
          description: AccessTokenKey and AccessTokenSecret are wrong or invalid.
        '403':
          description: You do not have permission to perform the requested operation. | You have reached the maximum number of calls for this api.
        '404':
          description: The client {clientId} doesn't exist.
components:
  securitySchemes:
    AccessTokenKey:
      type: apiKey
      description: API access token key issued by the ON24 platform. Must be supplied together with AccessTokenSecret.
      name: AccessTokenKey
      in: header
    AccessTokenSecret:
      type: apiKey
      description: API access token secret corresponding to the AccessTokenKey. Must be supplied together with AccessTokenKey.
      name: AccessTokenSecret
      in: header
security:
- AccessTokenKey: []
- AccessTokenSecret: []
