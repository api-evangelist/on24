      responses:
        '200':
          description: Speaker Bio created.
          content:
            application/json:
              example:
                message: RECEIVED
                speaker:
                  id: 123
                  file: myfile.jpg
                  name: John Doe
                  title: Product Manager
                  company: ON24
                  email: john.doe@on24.com
                  linkedin: https://x
                  website: https://x
                  description: Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
        '400':
          description: Invalid metadata or file is not accepted filetype.
        '401':
          description: AccessTokenKey and AccessTokenSecret are wrong or invalid.
        '403':
          description: You do not have permission to perform the requested operation. | You have reached the maximum number of calls for this api. | The client id {clientId} is inactive. | The event {eventId} is inactive.
        '404':
          description: The client {clientId} doesn't exist. | The event {eventId} doesn't exist. | The Speaker Bio widget is not available for this event.
