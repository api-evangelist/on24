      description: 'Creates a new speaker bio element in the Speaker Bio widget of a webinar.


        - A Speaker Bio widget must already exist in the webinar. If a Speaker Bio widget does not exist, a 404 response will be returned.


        ### Supported File Types for Speaker Bio Image


        - .jpg

        - .gif

        - .png


        ### Required ''metadata'' JSON key-value pairs


        - name

        - email


        ### ''metadata'' restrictions


        - Only up to three (3) among "email", "twitter", "linkedin", "website", and "facebook" can be provided. Providing more than three will result in a 400 *Invalid metadata* response.'
      operationId: EventManagement.CreateSpeakerBio
      parameters:
      - name: accessTokenKey
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: content-type
        in: header
        description: 'It must be: "multipart/form-data"'
        required: true
        schema:
          type: string
        example: multipart/form-data
      - name: clientId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
