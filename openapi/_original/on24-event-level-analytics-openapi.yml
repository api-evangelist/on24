          description: "Return list of registrants for an event\n\n- This endpoint returns data on people who registered for a Virtual Environment (VE).\n- Properties that will not be returned for VE registrants include:\n  - userprofileurl\n  - engagementprediction\n  - emailformat\n- The following values are cached on the server between 3 - 24 hours:\n  - engagementprediction"
