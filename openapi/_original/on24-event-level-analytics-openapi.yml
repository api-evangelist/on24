  /client/{clientId}/event/{eventId}/attendeesession:
    get:
      tags:
      - Event Level Analytics
      summary: Attendee Viewing Sessions
      description: 'Returns a list of attendee viewing sessions for a particular event. All dates and times are in Pacific Time.


        **sessionType** supported values:

        - "all" (default)

        - "live"

        - "ondemand"

        - "blocked"'
      operationId: AnalyticsEventLevel.AttendeeViewingSessions
      parameters:
      - name: accessTokenKey
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: sessiontype
        in: query
        description: Filter by session type
        schema:
          type: string
          default: All
        example: ondemand
      - name: pageoffset
        in: query
        description: Number of page to retrieve
        schema:
          type: integer
          format: int64
          default: 0
        example: 5
      - name: itemsperpage
        in: query
        description: Number of items to be retrieved per page
        schema:
          type: integer
          format: int64
          default: 100
        example: 25
      - name: startdate
        in: query
        description: Limit results to sessions created from start Date
        schema:
          type: string
          format: date
        example: '2021-04-10'
      - name: enddate
        in: query
        description: 'Limit results to sessions with last update until end Date. Default: current date if startDate was provided and endDate was not.'
        schema:
          type: string
          format: date
          default: Current date if startDate value was provided and endDate value was not provided
        example: '2021-04-15'
      - name: clientId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Return list of attendee viewing sessions for an event
          content:
            application/json:
              example:
                totalattendeesessions: 2
                pagecount: 1
                currentpage: 0
