openapi: 3.0.1
info:
  title: ON24 WCC API v2 — Event Level Analytics
  description: 'ON24 Webinar & Content Center REST API v2. All secured endpoints require two request headers: AccessTokenKey and AccessTokenSecret. Both headers must be supplied together — providing only one is not sufficient.'
  version: '2'
servers:
- url: https://api.on24.com/v2
  description: North America (production)
- url: https://api.eu.on24.com/v2
  description: European Union (production)
tags:
- name: Event Level Analytics
paths:
  /client/{clientId}/event/{eventId}:
    get:
      tags:
      - Event Level Analytics
      summary: Metadata and Usage
      description: 'Return information and summary activity about a particular event.


        - If double opt-in verification was enabled at the time of registration for an event and a user has not completed the verification process, the user will not be included in the eventanalytics section of the response (totalregistrants, noshowcount).'
      operationId: AnalyticsEventLevel.MetadataAndUsage
      parameters:
      - name: accessTokenKey
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: clientId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'Return information for an event.


            - **noshowcount** (calculated as **totalregistrants** - **totalattendees**) indicates the number of anonymous users who did not completed the registration for a particular event.'
