  /client/{clientId}/event/{eventId}/registrant:
    get:
      tags:
      - Event Level Analytics
      summary: Registrants
      description: "Retrieves a list of registrants for a particular event.\n\n- If double opt-in verification was enabled at the time of registration for an event and a user has not completed the verification process, the user will not be included in any endpoint responses.\n- **dateFilterMode** parameter options (not case-sensitive):\n  - If the parameter is not included or no value is supplied, **startDate** and **endDate** will work in the manner they usually do.\n  - \"lastActivity\" is the only supported value. When passed, the response will include only those registrants who have had activity between (and including) the provided startDate and endDate. Registrant lastActivity value is updated with a new modified date whenever one of the following API endpoints gets invoked to modify the registration information:\n    - REST Registration\n    - Update Registrant (client-level)\n    - Forget Registrant (client-level)\n    - Forget All Registrant (client-level)\n    - Forget All Registrant (event-level)"
      operationId: AnalyticsEventLevel.Registrants
      parameters:
      - name: accessTokenKey
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: dateInterval
        in: query
        description: Number of days returned in a response. See Rolling Interval.
        schema:
          type: integer
          format: int64
        example: 30
      - name: dateIntervalOffset
        in: query
        description: Number of days from which the interval should encompass. See Rolling Interval.
        schema:
          type: integer
          format: int64
          default: 0
        example: 4
      - name: dateIntervalTimezone
        in: query
        description: Timezone to be used for determining the 24 hour period that constitutes a day. See Rolling Interval.
        schema:
          type: string
          default: America/Los_Angeles
        example: America/Los_Angeles
      - name: accept
        in: header
        description: 'Output format. possible values: Application/xml or Application/json'
        schema:
          type: string
          default: application/json
        example: application/json
      - name: startdate
        in: query
        description: Limit results to registrants with registration date after startDate
        schema:
          type: string
        example: '2017-12-31'
      - name: enddate
        in: query
        description: Limit results to registrants with registration date before endDate
        schema:
          type: string
        example: '2017-12-31'
      - name: partnerref
        in: query
        description: Filter by partnerref
        schema:
          type: string
        example: EM
      - name: userstatus
        in: query
        description: 'Filter to users based on their status. If not provided, only regular users will be returned. Possible values: any: will return all registrants, including: active, soft-deleted and forgotten registrants. deleted: will return soft-deleted users only. forgotten: will return forgotten users only. all: **deprecated** - will include regular and soft-deleted users. **Note:** By design, there is No option to exclude soft-deleted users from the response.'
        schema:
          type: string
          default: any
        example: any
      - name: email
        in: query
        description: email registrant filter
        schema:
          type: string
        example: test@domain.com
      - name: noshow
        in: query
        description: Filters registrants who did not show up for the event
        schema:
          type: string
          default: N
        example: Y
      - name: filterforgotten
        in: query
        description: '**Deprecated** - Forgotten registrants filter. Y: only forgotten users will be returned in the response. N: forgotten users will be omitted in the response.'
        schema:
          type: string
          default: N
        example: Y
      - name: excludeanonymous
        in: query
        description: Filter to exclude System-Generated Email Addresses
        schema:
          type: string
          default: N
        example: Y
      - name: datefiltermode
        in: query
        description: Type of date to be used with the startDate and endDate parameters.
        schema:
          type: string
        example: lastActivity
      - name: clientId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
