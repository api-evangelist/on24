  /client/{clientId}/event/{eventId}/attendee:
    get:
      tags:
      - Event Level Analytics
      summary: Attendees
      description: "Returns a list of attendees for a particular event. All dates and times are in Pacific Time.\n\n- **dateFilterMode** parameter options (not case-sensitive):\n  - If the parameter is not included or no value is supplied, **startDate** and **endDate** will work in the manner they usually do.\n  - \"lastActivity\" is the only supported value. When passed, the response will include only those attendees who have had activity between (and including) the provided **startDate** and **endDate**. Attendee lastActivity value is updated with new modified date whenever one of the following actions is performed by an attendee:\n    - Starting new session\n    - Refreshing browser during webcast presentation\n    - Submitting poll answers"
      operationId: AnalyticsEventLevel.Attendees
      parameters:
      - name: accessTokenKey
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 63129107067A520E6B7DE18D5E1CB2BF
      - name: accessTokenSecret
        in: header
        description: Security Parameter
        required: true
        schema:
          type: string
        example: 072639740ac239333e3708a1623b9de3590d972e6b1060071b726ecfd9b216001b45391717d9fbeb780438
      - name: dateInterval
        in: query
        description: Number of days returned in a response. See Rolling Interval.
        schema:
          type: integer
          format: int64
        example: 30
      - name: dateIntervalOffset
        in: query
        description: Number of days from which the interval should encompass. See Rolling Interval.
        schema:
          type: integer
          format: int64
          default: 0
        example: 4
      - name: dateIntervalTimezone
        in: query
        description: Timezone to be used for determining the 24 hour period that constitutes a day. See Rolling Interval.
        schema:
          type: string
          default: America/Los_Angeles
        example: America/Los_Angeles
      - name: startdate
        in: query
        description: Limit results to those with attendee activity after startDate
        schema:
          type: string
        example: '2017-12-31'
      - name: enddate
        in: query
        description: Limit results to those with attendee activity before endDate
        schema:
          type: string
        example: '2017-12-31'
      - name: partnerref
        in: query
        description: Filter by partnerref
        schema:
          type: string
        example: EM
      - name: userstatus
        in: query
        description: 'Filter to users based on their status. If not provided, only regular users will be returned. Possible values: any: will return all registrants, including: active, soft-deleted and forgotten registrants. deleted: will return soft-deleted users only. forgotten: will return forgotten users only. **Note:** By design, there is No option to exclude soft-deleted users from the response.'
        schema:
          type: string
          default: any
        example: any
      - name: filterforgotten
        in: query
        description: '**Deprecated** - Forgotten registrants filter. Y: only forgotten users will be returned in the response. N: forgotten users will be omitted in the response.'
        schema:
          type: string
          default: N
        example: Y
      - name: excludeanonymous
        in: query
        description: Filter to exclude System-Generated Email Addresses
        schema:
          type: string
          default: N
        example: Y
      - name: datefiltermode
        in: query
        description: Type of date to be used with the startDate and endDate parameters.
        schema:
          type: string
        example: lastActivity
      - name: clientId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: "Return list of attendees for an event\n\n- Values for fields **liveminutes**, **archiveminutes**, **cumulativeliveminutes** and **cumulativearchiveminutes** are rounded to the closest integer value (e.g. 2.316 is returned as 2, 3.542 is returned as 4). If an attendee's actual viewing minutes are greater than 0 and less than 1, response will return 1 as the value (e.g. 0.123 is returned as 1).\n- The following values are cached on the server between 3 - 24 hours:\n  - engagementscore"
          content:
            application/json:
              examples:
                Elite account:
                  description: Elite account
                  value:
                    eventid: 311512
                    totalattendees: 1
                    attendees:
                    - email: xxxxxxxx@on24.com
                      eventuserid: 49502149
                      exteventusercd: '1502'
                      userstatus: active
                      isblocked: N
                      engagementscore: 8.5
                      liveminutes: 40
                      liveviewed: 1
                      firstliveactivity: '2015-05-19T11:01:42-07:00'
                      lastliveactivity: '2015-05-19T11:41:42-07:00'
                      archiveminutes: 120
                      archiveviewed: 2
                      firstarchiveactivity: '2015-05-19T06:14:17-07:00'
                      lastarchiveactivity: '2015-05-19T09:20:48-08:00'
                      askedquestions: 2
                      resourcesdownloaded: 2
                      answeredpolls: 2
                      answeredsurveys: 2
                      answeredsurveyquestions: 4
                      launchmode: At the Venue
                      questions:
