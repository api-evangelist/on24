notes: 'ON24 models everything under a single numeric CLIENT (account) root. Every path begins /client/{clientId}.
  Events hang off the client; registrants, attendees and all engagement objects hang off the event. EMAIL is the
  natural key for a person: registrants and attendees are addressed by {email}, not by an opaque id, which is why
  the GDPR forget operations are also keyed by email. There are no id-prefixed opaque identifiers in this API —
  identifiers are bare numerics (clientId, eventId, emailId, mediaId) and email addresses. No response schemas are
  declared in the spec (all 200 responses carry examples but no `schema`), so field-level attributes below are read
  from the published response EXAMPLES, not from a schema.'
