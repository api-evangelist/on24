problem_types:
- type: authentication-missing
  status: 401
  title: Access token headers missing
  detail: Header must contain both accessTokenKey and accessTokenSecret.
  remediation: Send BOTH AccessTokenKey and AccessTokenSecret request headers; supplying only one is rejected.
- type: authentication-invalid
  status: 401
  title: Access token invalid or deactivated
  detail: AccessTokenKey and AccessTokenSecret are wrong or invalid, not found, or deactivated.
  remediation: Re-issue the token pair in the ON24 platform; confirm the pair belongs to the clientId in the path.
- type: permission-denied
  status: 403
  title: Operation not permitted for this client
  detail: You do not have permission to perform the requested operation; or the client id is not an Elite user;
    or the adminId cannot operate under this client.
  remediation: Confirm the token pair is scoped to the clientId and that the account tier (Elite) entitles the endpoint.
- type: quota-exceeded
  status: 403
  title: API call quota exhausted
  detail: You have reached the maximum number of calls for this api / for this endpoint.
  remediation: 'Back off and retry later. NOTE: ON24 returns 403 (not 429) on quota exhaustion and publishes no
    Retry-After or RateLimit-* headers, so clients must distinguish quota from permission by inspecting the message
    string.'
- type: client-inactive
  status: 403
  title: Client is inactive
  detail: The client id {clientId} is inactive.
  remediation: Reactivate the ON24 client account.
- type: client-not-found
  status: 404
  title: Client does not exist
  detail: The client {clientId} doesn't exist.
  remediation: Verify the numeric clientId in the request path.
- type: event-not-found
  status: 404
  title: Event does not exist
  detail: The event {eventId} doesn't exist, or is not found for this client or its children.
  remediation: Verify eventId and that it belongs to the clientId (or a child account when includesubaccounts is
    used).
- type: registrant-not-found
  status: 404
  title: Registrant not found
  detail: No registrant was found for that email address.
  remediation: Confirm the email is registered for the event before PATCHing.
- type: event-already-deleted
  status: 410
  title: Event already deleted
  detail: Event has already been deleted.
  remediation: Treat as terminal; the delete is already effective.
- type: precondition-failed
  status: 412
  title: Precondition not met
  detail: Event does not meet criteria for deletion; or you are trying to soft delete the registrant you are creating.
  remediation: Split create and soft-delete into separate calls; check event state before deletion.
- type: bulk-limit-exceeded
  status: 400
  title: Bulk forget limit exceeded
  detail: You have exceeded the maximum number of user to be deleted (100,000).
  remediation: Chunk forget/forgetall requests to <= 100,000 users per call.
- type: date-format-invalid
  status: 400
  title: Incorrect date format
  detail: Error, incorrect date formats.
  remediation: Use the date format documented for the endpoint parameters (startDate/endDate).
