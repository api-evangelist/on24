aid: on24
name: On24
description: >-
  ON24 (NYSE: ONTF) is a digital engagement and webinar platform that companies
  use to run webinars, virtual events, and always-on content experiences and to
  turn the resulting first-party engagement data into marketing and sales
  intelligence. ON24 publishes a complete, anonymously accessible OpenAPI 3.0.1
  for its Webinar & Content Center (WCC) REST API v2 at
  https://api.on24.com/v2/openapi.json — 58 paths and 67 operations across six
  tags: Client Level Analytics, Event Level Analytics, Event Management, REST
  Registration, Content Listings and Helpers. Customers use it to automate
  registrant creation, pull attendee and engagement analytics into their CRM,
  marketing automation platform or data warehouse, provision and configure
  webinars, and honour GDPR erasure requests. The API runs from two regional
  hosts, https://api.on24.com/v2 (North America) and https://api.eu.on24.com/v2
  (European Union), and is authenticated with a paired accessTokenKey /
  accessTokenSecret set of HTTP headers plus a numeric client id in every path.
  There is no OAuth surface, no first-party SDK and no MCP server, and rate-limit
  exhaustion is signalled as HTTP 403 rather than 429.
