aid: on24
name: On24
description: >-
  ON24 (NYSE: ONTF) is a digital engagement and webinar platform that companies
  use to run webinars, virtual events, and always-on content experiences and to
  turn the resulting first-party engagement data into marketing and sales
  intelligence. ON24 exposes a REST API surface (documented at apidoc.on24.com,
  served from api.on24.com) covering Registration, Analytics/Reporting, Event
  Management, and User Management so customers can automate registrant creation,
  pull attendee and engagement analytics into their CRM/MAP, and integrate the
  platform with marketing-automation and data-warehouse workflows. Requests are
  authenticated with a client id plus an accessTokenKey / accessTokenSecret pair
  sent as HTTP headers.
